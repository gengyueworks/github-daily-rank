name: daily-rank

on:
  # 主自动化已迁移到本机 launchd（com.local.github-daily-rank），
  # 本 workflow 仅保留手动触发作为兜底（避免云端与本机双跑互相覆盖 data）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rank
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape trending (daily + weekly)
        run: python scraper.py

      - name: Inject Chinese translations
        run: python inject_zh.py

      - name: Build static site
        run: python build.py

      - name: Deploy site/ to gh-pages
        run: |
          rm -rf /tmp/ghrank_pages
          cp -r site /tmp/ghrank_pages
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          git rm -rf . -q 2>/dev/null || true
          cp -r /tmp/ghrank_pages/. .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "site: publish $(date +%Y-%m-%d)" --quiet || true
          git push -f origin gh-pages
