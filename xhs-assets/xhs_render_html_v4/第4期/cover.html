<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1660px;background:#002FA7;font-family:"Noto Serif CJK SC",Georgia,serif;color:#ffffff;position:relative;overflow:hidden}
.frame{position:absolute;inset:0;padding:104px 96px 96px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:"Liberation Mono",Menlo,monospace;font-size:24px;letter-spacing:.28em}
.kicker{color:#ffffff;font-weight:700}
h1{font-size:92px;line-height:1.35;font-weight:600;margin-top:84px;letter-spacing:.01em;color:#ffffff}
.rows{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;margin-top:24px}
.row{display:flex;align-items:flex-start;padding:50px 0;border-top:1px solid rgba(255,255,255,.28)}

.rbody{flex:1}
.repo{font-family:"Liberation Mono",Menlo,monospace;font-size:32px;color:rgba(255,255,255,.75);letter-spacing:.02em}
.desc{font-size:44px;line-height:1.55;font-weight:600;margin-top:18px;color:#ffffff}
.gain{font-family:"Liberation Mono",Menlo,monospace;font-size:24px;color:rgba(255,255,255,.65);margin-top:16px;letter-spacing:.06em}
.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.28);padding-top:36px}
.byline{font-family:"Liberation Mono",Menlo,monospace;font-size:24px;letter-spacing:.12em;color:#ffffff;display:flex;align-items:center}
.byline span{color:rgba(255,255,255,.6);margin-left:10px}
.mark{width:22px;height:22px;background:#ffffff;display:inline-block;margin-right:18px}
.series{font-family:"Liberation Mono",Menlo,monospace;font-size:22px;color:rgba(255,255,255,.6);letter-spacing:.2em}
</style></head>
